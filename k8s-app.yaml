apiVersion: apps/v1
kind: Deployment
metadata:
  name: mynode-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mynode
  template:
    metadata:
      labels:
        app: mynode
    spec:
      containers:
      - name: mynode-container
        image: mynodeapp:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 3000

---
apiVersion: v1
kind: Service
metadata:
  name: mynode-service
spec:
  type: NodePort
  selector:
    app: mynode
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30007